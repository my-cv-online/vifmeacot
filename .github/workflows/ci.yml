# Workflow CI: menjalankan `make tools` dan `make check` di setiap push ke main dan setiap pull
# request (docs/10-milestones.md M0, docs/11-testing.md §1). Mulai M2 job kedua menjalankan
# `make e2e` dengan Playwright Chromium.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Workflow hanya perlu membaca isi repository.
permissions:
  contents: read

# Setiap commit di main punya grup sendiri (per SHA) sehingga semuanya diuji sampai selesai;
# untuk pull request, run lama dibatalkan bila ada push baru ke pull request yang sama.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Versi Go diambil dari go.mod. Belum ada go.sum di M0, jadi cache modul dikunci pada go.mod.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      # Alat Go di bin/ di-cache dengan kunci dari versi Go dan baris versi alat di Makefile,
      # supaya `make tools` tidak membangun ulang sqlc dan golangci-lint di setiap run.
      - name: Compute tools cache key
        id: tools-key
        run: echo "key=tools-${{ runner.os }}-$(go env GOVERSION)-$(grep -E '^[A-Z_]+_VERSION :=' Makefile | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: bin
          key: ${{ steps.tools-key.outputs.key }}

      # Node 24 LTS untuk web/; cache npm dikunci pada package-lock.json.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: make tools
        run: make tools

      - name: make check
        run: make check

      # Test case TC-M00-023: make check (termasuk make gen) tidak boleh mengubah file yang di-track.
      - name: TC-M00-023 working tree stays clean
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      # Test case TC-M00-021: binary hasil `make build` menyajikan SPA yang tertanam di :8080.
      # File sementara ditulis ke RUNNER_TEMP supaya working tree tetap bersih.
      - name: TC-M00-021 build binary and serve SPA
        env:
          DATABASE_URL: postgres://pfmea:unused@127.0.0.1:5432/pfmea
          APP_BASE_URL: http://localhost:8080
          HTTP_ADDR: 127.0.0.1:8080
        run: |
          make build
          ./bin/pfmea serve > "$RUNNER_TEMP/serve.log" 2>&1 &
          server=$!
          # Tunggu sampai server menjawab (maksimal sekitar 10 detik).
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:8080/healthz > /dev/null && break; sleep 0.2; done
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/ -o "$RUNNER_TEMP/index.html"
          # Semua placeholder template sudah diganti SvelteKit (tidak ada yang tertelan komentar).
          if grep -q '%sveltekit' "$RUNNER_TEMP/index.html"; then echo "unreplaced %sveltekit placeholder"; exit 1; fi
          # Deep link mendapat index.html yang sama; aset dirujuk dengan path absolut /_app/.
          curl -fsS http://127.0.0.1:8080/packages/PS-07/pfmea | cmp - "$RUNNER_TEMP/index.html"
          asset=$(grep -o '"/_app/immutable/[^"]*\.js"' "$RUNNER_TEMP/index.html" | head -1 | tr -d '"')
          test -n "$asset"
          curl -fsSI "http://127.0.0.1:8080$asset" | tee "$RUNNER_TEMP/asset.headers"
          grep -qi '^cache-control: public, max-age=31536000, immutable' "$RUNNER_TEMP/asset.headers"
          kill "$server"

      # Test case TC-M00-022: `make db` menjalankan PostgreSQL 18 yang sehat dengan JIT mati.
      - name: TC-M00-022 make db starts PostgreSQL 18
        run: |
          cp .env.example .env
          make db
          version=$(docker compose exec -T db psql -U pfmea -d pfmea -Atc 'show server_version')
          jit=$(docker compose exec -T db psql -U pfmea -d pfmea -Atc 'show jit')
          echo "server_version=$version jit=$jit"
          case "$version" in 18*) ;; *) exit 1 ;; esac
          test "$jit" = off
          docker compose down -v
          rm .env
