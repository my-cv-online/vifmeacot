<!doctype html>
<!--
	Template HTML SPA. SvelteKit mengisi placeholder bagian head dan body di bawah; hasil build-nya
	menjadi index.html yang disajikan binary Go untuk semua path non-API. Jangan menulis nama
	placeholder SvelteKit di komentar ini: SvelteKit juga menggantinya di dalam komentar.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
