# Kontrak API Tahap 1 (OpenAPI 3.0.3). Ubah file ini lebih dulu, lalu jalankan `make gen`.
# Aturan yang tidak bisa dinyatakan skema (semantik edit, kunci, realtime) ada di docs/05-api.md.
# Deskripsi di dalam kontrak ditulis dalam bahasa Inggris (dokumentasi API); kode hasil generate tidak diedit.
openapi: 3.0.3
info:
  title: PFMEA / Control Plan / PFD system API
  version: 1.0.0-phase1
  description: 'Contract for Phase 1. Source of truth for Go (oapi-codegen v2, strict server) and TypeScript (openapi-typescript
    + openapi-fetch). Rules that a schema cannot express are in docs/05-api.md. Not in this file: the WebSocket /api/v1/ws
    (docs/05-api.md section 10) and /healthz, /readyz, /metrics. All mutating requests need Content-Type application/json,
    an Origin header equal to APP_BASE_URL and should send X-Request-Id. Enum values are the database values.'
servers:
- {url: /api/v1}
security:
- cookieAuth: []
tags:
- {name: auth, description: Login and session}
- {name: users, description: User accounts}
- {name: master, description: 'Master data, rules and settings'}
- {name: packages, description: Packages and documents}
- {name: views, description: Screen read models}
- {name: editing, description: Content changes}
- {name: template, description: Template General and links}
- {name: checks, description: Consistency checks and findings}
- {name: exports, description: Excel export}
- {name: monitoring, description: 'Dashboard, activity and search'}
paths:
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with username and password
      description: 401 unauthenticated on wrong credentials, 429 rate_limited after repeated failures.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Logged in; sets the pfmea_session cookie
          headers:
            Set-Cookie:
              schema: {type: string}
              description: pfmea_session=<token>; HttpOnly; SameSite=Lax; Path=/
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        default: {$ref: '#/components/responses/Problem'}
      security: []
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out (deletes the session)
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        default: {$ref: '#/components/responses/Problem'}
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Current user, global permissions and settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        default: {$ref: '#/components/responses/Problem'}
  /auth/password:
    post:
      operationId: changeOwnPassword
      tags: [auth]
      summary: Change own password (local users)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        default: {$ref: '#/components/responses/Problem'}
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users (for pickers; admin screen)
      parameters:
      - name: active
        in: query
        required: false
        schema: {type: boolean}
        description: Filter by isActive
      - name: q
        in: query
        required: false
        schema: {type: string}
        description: Search username or name
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserList'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        default: {$ref: '#/components/responses/Problem'}
  /users/{userId}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update, deactivate or reset password (admin)
      parameters:
      - {$ref: '#/components/parameters/userId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserUpdate'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        default: {$ref: '#/components/responses/Problem'}
  /customers:
    get:
      operationId: listCustomers
      tags: [master]
      summary: List customers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerList'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createCustomer
      tags: [master]
      summary: Create a customer (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomerCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Customer'}
        default: {$ref: '#/components/responses/Problem'}
  /customers/{customerId}:
    get:
      operationId: getCustomer
      tags: [master]
      summary: Get a customer
      parameters:
      - {$ref: '#/components/parameters/customerId'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Customer'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateCustomer
      tags: [master]
      summary: Update a customer (admin)
      description: Changing CSR settings schedules a full check of the customer's packages.
      parameters:
      - {$ref: '#/components/parameters/customerId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomerUpdate'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Customer'}
        default: {$ref: '#/components/responses/Problem'}
  /customers/{customerId}/sc-symbols:
    put:
      operationId: replaceCustomerScSymbols
      tags: [master]
      summary: Replace the customer's symbol conversion table (admin)
      description: Clears cached exports of the customer's packages and schedules checks (S02).
      parameters:
      - {$ref: '#/components/parameters/customerId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomerScSymbolsReplace'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Customer'}
        default: {$ref: '#/components/responses/Problem'}
  /sc-symbols:
    get:
      operationId: listScSymbols
      tags: [master]
      summary: List special-characteristic classes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScSymbolList'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createScSymbol
      tags: [master]
      summary: Create a class (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScSymbolCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScSymbol'}
        default: {$ref: '#/components/responses/Problem'}
  /sc-symbols/{scSymbolId}:
    patch:
      operationId: updateScSymbol
      tags: [master]
      summary: Update a class (admin)
      parameters:
      - {$ref: '#/components/parameters/scSymbolId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScSymbolUpdate'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScSymbol'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteScSymbol
      tags: [master]
      summary: Delete an unused class (admin)
      description: 409 delete_blocked while characteristics use it.
      parameters:
      - {$ref: '#/components/parameters/scSymbolId'}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        default: {$ref: '#/components/responses/Problem'}
  /parts:
    get:
      operationId: listParts
      tags: [master]
      summary: List parts
      parameters:
      - name: customerId
        in: query
        required: false
        schema: {type: string, format: uuid}
      - name: active
        in: query
        required: false
        schema: {type: boolean}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PartList'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createPart
      tags: [master]
      summary: Create a part (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PartCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Part'}
        default: {$ref: '#/components/responses/Problem'}
  /parts/{partId}:
    patch:
      operationId: updatePart
      tags: [master]
      summary: Update a part (admin)
      description: A new change level schedules checks (K06) of the packages using the part.
      parameters:
      - {$ref: '#/components/parameters/partId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PartUpdate'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Part'}
        default: {$ref: '#/components/responses/Problem'}
  /control-library:
    get:
      operationId: listControlLibrary
      tags: [master]
      summary: List control library items
      parameters:
      - name: kind
        in: query
        required: false
        schema: {$ref: '#/components/schemas/ControlKind'}
      - name: active
        in: query
        required: false
        schema: {type: boolean}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ControlLibraryList'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createControlLibraryItem
      tags: [master]
      summary: Create a library item (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ControlLibraryCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ControlLibraryItem'}
        default: {$ref: '#/components/responses/Problem'}
  /control-library/{itemId}:
    patch:
      operationId: updateControlLibraryItem
      tags: [master]
      summary: Update a library item (admin)
      parameters:
      - {$ref: '#/components/parameters/itemId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ControlLibraryUpdate'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ControlLibraryItem'}
        default: {$ref: '#/components/responses/Problem'}
  /rating-criteria:
    get:
      operationId: listRatingCriteria
      tags: [master]
      summary: S/O/D criteria text
      parameters:
      - name: methodology
        in: query
        required: false
        schema: {$ref: '#/components/schemas/Methodology'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RatingCriteriaList'}
        default: {$ref: '#/components/responses/Problem'}
  /rating-criteria/{methodology}/{dimension}:
    put:
      operationId: replaceRatingCriteria
      tags: [master]
      summary: Replace the criteria of one methodology and dimension (admin)
      parameters:
      - {$ref: '#/components/parameters/methodology'}
      - {$ref: '#/components/parameters/dimension'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RatingCriteriaReplace'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RatingCriteriaList'}
        default: {$ref: '#/components/responses/Problem'}
  /banned-terms:
    get:
      operationId: listBannedTerms
      tags: [master]
      summary: List banned terms (F12)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BannedTermList'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createBannedTerm
      tags: [master]
      summary: Create a banned term (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BannedTermCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BannedTerm'}
        default: {$ref: '#/components/responses/Problem'}
  /banned-terms/{bannedTermId}:
    patch:
      operationId: updateBannedTerm
      tags: [master]
      summary: Update a banned term (admin)
      parameters:
      - {$ref: '#/components/parameters/bannedTermId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BannedTermUpdate'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BannedTerm'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteBannedTerm
      tags: [master]
      summary: Delete a banned term (admin)
      parameters:
      - {$ref: '#/components/parameters/bannedTermId'}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        default: {$ref: '#/components/responses/Problem'}
  /rules:
    get:
      operationId: listRules
      tags: [master]
      summary: Rule catalog with customer overrides
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleList'}
        default: {$ref: '#/components/responses/Problem'}
  /rules/{ruleCode}:
    patch:
      operationId: updateRule
      tags: [master]
      summary: Enable/disable a rule or change its default level (admin)
      parameters:
      - {$ref: '#/components/parameters/ruleCode'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RuleUpdate'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Rule'}
        default: {$ref: '#/components/responses/Problem'}
  /rules/{ruleCode}/customer-overrides:
    put:
      operationId: replaceRuleCustomerOverrides
      tags: [master]
      summary: Replace per-customer level / enable overrides of a rule (admin)
      parameters:
      - {$ref: '#/components/parameters/ruleCode'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RuleCustomerOverridesReplace'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Rule'}
        default: {$ref: '#/components/responses/Problem'}
  /settings:
    get:
      operationId: getSettings
      tags: [master]
      summary: Application settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Settings'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateSettings
      tags: [master]
      summary: Update settings (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SettingsUpdate'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Settings'}
        default: {$ref: '#/components/responses/Problem'}
  /packages:
    get:
      operationId: listPackages
      tags: [packages]
      summary: List packages
      parameters:
      - name: kind
        in: query
        required: false
        schema: {$ref: '#/components/schemas/PackageKind'}
      - name: customerId
        in: query
        required: false
        schema: {type: string, format: uuid}
      - name: ownerId
        in: query
        required: false
        schema: {type: string, format: uuid}
      - name: q
        in: query
        required: false
        schema: {type: string}
        description: Code or name contains
      - name: health
        in: query
        required: false
        schema: {$ref: '#/components/schemas/Health'}
      - {$ref: '#/components/parameters/limit'}
      - {$ref: '#/components/parameters/cursor'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PackageList'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createPackage
      tags: [packages]
      summary: Create a model package from the released Template General
      description: Copies mandatory and selected optional general processes as linked rows, numbers the three documents and
        runs a check. See docs/07-template-general.md section 2.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PackageCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PackageDetail'}
        default: {$ref: '#/components/responses/Problem'}
  /packages/{packageId}:
    get:
      operationId: getPackage
      tags: [packages]
      summary: Package detail with documents, members and permissions
      parameters:
      - {$ref: '#/components/parameters/packageId'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PackageDetail'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updatePackage
      tags: [packages]
      summary: Update package settings
      parameters:
      - {$ref: '#/components/parameters/packageId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PackageUpdate'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PackageDetail'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deletePackage
      tags: [packages]
      summary: Delete a model package (admin)
      description: The general package cannot be deleted.
      parameters:
      - {$ref: '#/components/parameters/packageId'}
      - name: confirm
        in: query
        required: true
        schema: {type: string}
        description: Must equal the package code
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        default: {$ref: '#/components/responses/Problem'}
  /packages/{packageId}/members:
    put:
      operationId: replacePackageMembers
      tags: [packages]
      summary: Replace members (owner, approver, admin)
      parameters:
      - {$ref: '#/components/parameters/packageId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MembersReplace'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PackageDetail'}
        default: {$ref: '#/components/responses/Problem'}
  /packages/{packageId}/mark-reviewed:
    post:
      operationId: markPackageReviewed
      tags: [packages]
      summary: Set last reviewed date to now (clears W04)
      parameters:
      - {$ref: '#/components/parameters/packageId'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PackageDetail'}
        default: {$ref: '#/components/responses/Problem'}
  /packages/{packageId}/views/pfd:
    get:
      operationId: getPfdView
      tags: [views]
      summary: PFD screen data
      parameters:
      - {$ref: '#/components/parameters/packageId'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PfdView'}
        default: {$ref: '#/components/responses/Problem'}
  /packages/{packageId}/views/pfmea:
    get:
      operationId: getPfmeaView
      tags: [views]
      summary: PFMEA worksheet data
      parameters:
      - {$ref: '#/components/parameters/packageId'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PfmeaView'}
        default: {$ref: '#/components/responses/Problem'}
  /packages/{packageId}/views/control-plan:
    get:
      operationId: getControlPlanView
      tags: [views]
      summary: Control Plan data for one phase
      parameters:
      - {$ref: '#/components/parameters/packageId'}
      - name: phase
        in: query
        required: false
        schema: {$ref: '#/components/schemas/CpPhase'}
        description: Default production
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ControlPlanView'}
        default: {$ref: '#/components/responses/Problem'}
  /packages/{packageId}/changes:
    post:
      operationId: applyChanges
      tags: [editing]
      summary: Save cell edits (batch, all or nothing)
      description: 'Semantics in docs/05-api.md section 6. Errors: 409 version_conflict, 409 locked_by_template, 422 validation_failed,
        422 override_reason_required.'
      parameters:
      - {$ref: '#/components/parameters/packageId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangeRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MutationResult'}
        default: {$ref: '#/components/responses/Problem'}
  /packages/{packageId}/move:
    post:
      operationId: moveRow
      tags: [editing]
      summary: Reorder a row among its siblings
      parameters:
      - {$ref: '#/components/parameters/packageId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MoveRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MutationResult'}
        default: {$ref: '#/components/responses/Problem'}
  /packages/{packageId}/paste:
    post:
      operationId: pasteRows
      tags: [editing]
      summary: Bulk paste rows copied from Excel
      description: 'docs/05-api.md section 8. Invalid input is not an error: 200 with valid=false, performed=false and the
        per-row report; nothing is created.'
      parameters:
      - {$ref: '#/components/parameters/packageId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasteRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PasteResult'}
        default: {$ref: '#/components/responses/Problem'}
  /packages/{packageId}/steps:
    post:
      operationId: createStep
      tags: [editing]
      summary: Create a process step
      parameters:
      - {$ref: '#/components/parameters/packageId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StepCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MutationResult'}
        default: {$ref: '#/components/responses/Problem'}
  /packages/{packageId}/steps/{rowId}:
    delete:
      operationId: deleteStep
      tags: [editing]
      summary: Delete a process step
      description: 409 delete_blocked lists blocking rows; dryRun=true reports what would be deleted or unlinked.
      parameters:
      - {$ref: '#/components/parameters/packageId'}
      - {$ref: '#/components/parameters/rowId'}
      - {$ref: '#/components/parameters/version'}
      - {$ref: '#/components/parameters/dryRun'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MutationResult'}
        default: {$ref: '#/components/responses/Problem'}
  /packages/{packageId}/step-flows:
    post:
      operationId: createStepFlow
      tags: [editing]
      summary: Create a flow (NG, rework, scrap, return)
      parameters:
      - {$ref: '#/components/parameters/packageId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StepFlowCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
