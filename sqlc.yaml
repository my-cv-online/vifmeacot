# Konfigurasi sqlc: membuat kode Go bertipe dari query SQL (dijalankan oleh `make gen`).
# Skema dibaca dari migrasi goose; hasilnya di backend/internal/store/sqlc dan tidak boleh
# diedit manual.
version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: backend/internal/store/queries
    gen:
      go:
        package: sqlc
        out: backend/internal/store/sqlc
        sql_package: pgx/v5
        # Kolom nullable menjadi pointer (*string, *time.Time) alih-alih tipe pgtype.
        emit_pointers_for_null_types: true
        # Hanya struct tabel/enum yang dipakai query yang dibuat.
        omit_unused_structs: true
        overrides:
          # Id memakai google/uuid di seluruh kode Go.
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          # Waktu memakai time.Time biasa.
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
